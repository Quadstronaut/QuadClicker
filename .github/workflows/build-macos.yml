name: Build macOS

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: macos-26   # Apple Silicon runner (M1)

    steps:
      - uses: actions/checkout@v7

      # Compile the app for real (QCLK-8). No signing: this proves the Swift builds, nothing more.
      - name: Show Xcode and project
        run: |
          xcodebuild -version
          xcodebuild -project macos/QuadClicker.xcodeproj -list

      - name: Build
        run: |
          xcodebuild -project macos/QuadClicker.xcodeproj -target QuadClicker -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      # Compile the unit-test bundle but do not run it. Running fails before any test
      # executes: XCTest launches the host app with AppKit arguments
      # (-NSTreatUnknownArgumentsAsOpen NO ...), QuadClickerApp.init treats any argument
      # as CLI mode, and the CLI exits 1 with "Unknown argument". Running the tests needs
      # an app change to that argument handling (tracked on QCLK-8, not made here).
      - name: Build unit tests (not run)
        run: |
          xcodebuild -project macos/QuadClicker.xcodeproj -scheme QuadClicker -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build-for-testing
