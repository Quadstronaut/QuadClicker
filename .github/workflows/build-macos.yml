name: Build macOS

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: macos-26   # Apple Silicon runner (M1)

    steps:
      - uses: actions/checkout@v7

      # Compile the app for real (QCLK-8). No signing: this proves the Swift builds, nothing more.
      - name: Probe input capabilities
        continue-on-error: true
        run: swift macos/ci/probe.swift

      - name: Show Xcode and project
        run: |
          xcodebuild -version
          xcodebuild -project macos/QuadClicker.xcodeproj -list

      - name: Build
        run: |
          xcodebuild -project macos/QuadClicker.xcodeproj -target QuadClicker -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      # Run the unit tests on the runner (QCLK-8). The app ignores the AppKit arguments
      # XCTest passes, so it no longer exits as "CLI mode" before tests start.
      - name: Unit tests
        run: |
          xcodebuild -project macos/QuadClicker.xcodeproj -scheme QuadClicker -destination 'platform=macOS'             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" test
