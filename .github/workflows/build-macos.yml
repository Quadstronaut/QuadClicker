name: Build macOS

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: macos-26   # Apple Silicon runner (M1)

    steps:
      - uses: actions/checkout@v7

      # Compile the app for real (QCLK-8). No signing: this proves the Swift builds, nothing more.
      - name: Show Xcode and project
        run: |
          xcodebuild -version
          xcodebuild -project macos/QuadClicker.xcodeproj -list

      - name: Build
        run: |
          xcodebuild -project macos/QuadClicker.xcodeproj -target QuadClicker -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      # Unit tests (parser, session, CLI-surface). They are pure: no CGEvent is posted.
      # The test bundle is hosted in the app, which launches without starting a click session.
      - name: Unit tests
        run: |
          xcodebuild -project macos/QuadClicker.xcodeproj -scheme QuadClicker -destination 'platform=macOS' \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" test

      # Only on failure: show what the test host printed (it can exit before XCTest connects).
      - name: Test diagnostics
        if: failure()
        run: |
          xcrun xcresulttool get log --path "$RUNNER_TEMP/tests.xcresult" --type console || true
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/tests.xcresult" || true
