name: Build macOS

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: macos-26   # Apple Silicon runner (M1)

    steps:
      - uses: actions/checkout@v7

      # Compile the app for real (QCLK-8). No signing: this proves the Swift builds, nothing more.
      - name: Probe input capabilities
        continue-on-error: true
        run: swift macos/ci/probe.swift

      - name: Show Xcode and project
        run: |
          xcodebuild -version
          xcodebuild -project macos/QuadClicker.xcodeproj -list

      - name: Build
        run: |
          xcodebuild -project macos/QuadClicker.xcodeproj -target QuadClicker -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      # F31: real SIGINT against the built CLI binary.
      - name: CLI SIGINT check (F31)
        run: bash macos/ci/cli-sigint.sh

      # Run the unit tests on the runner (QCLK-8). The app ignores the AppKit arguments
      # XCTest passes, so it no longer exits as "CLI mode" before tests start.
      - name: Unit tests
        run: |
          xcodebuild -project macos/QuadClicker.xcodeproj -scheme QuadClicker -destination 'platform=macOS' -resultBundlePath "$RUNNER_TEMP/qclk.xcresult"            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" test

      # Show assertion messages: plain xcodebuild output drops them.
      - name: Test failures and diagnostics
        if: always()
        run: |
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/qclk.xcresult" --compact | python3 -c '
          import json,sys
          def walk(n,path=""):
              p=path+"/"+n.get("name","")
              if n.get("nodeType")=="Failure Message": print("FAILURE", path, n.get("name"))
              if n.get("nodeType")=="Test Case": print(n.get("result"), p)
              for c in n.get("children",[]): walk(c,p)
          for n in json.load(sys.stdin).get("testNodes",[]): walk(n)
          '
          xcrun xcresulttool get log --type console --path "$RUNNER_TEMP/qclk.xcresult" 2>/dev/null | grep -E "F14 idle|F16 AX" || true
